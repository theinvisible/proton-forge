name: CI Build

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  build:
    name: build and unit tests
    runs-on: ubuntu-latest
    container:
      # Newest LTS. Note this decides which Qt the uploaded .deb is linked
      # against, and a package built against a newer Qt installs on an older
      # system and then refuses to start — so the artifact from this job is only
      # usable on 26.04 or later. release.yml makes the same choice for the
      # published package; see the note there.
      image: ubuntu:26.04

    steps:
      - name: Install Git
        run: |
          apt-get update
          apt-get install -y git

      - name: Checkout code
        uses: actions/checkout@v4

      # Build dependencies come from packaging/build-depends.txt, which the test
      # lab's container images use as well — one list, so a new dependency cannot
      # be added here and forgotten there.
      - name: Install build dependencies
        run: |
          apt-get update
          grep -vE '^\s*(#|$)' packaging/build-depends.txt \
            | xargs env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends

      - name: Build debug version with tests
        run: |
          cmake -S . -B cmake-build-debug -DCMAKE_BUILD_TYPE=Debug -DPROTONFORGE_BUILD_TESTS=ON
          cmake --build cmake-build-debug -j$(nproc)

      - name: Unit tests
        run: ctest --test-dir cmake-build-debug --output-on-failure

      - name: Build release version
        run: |
          cmake -S . -B cmake-build-release -DCMAKE_BUILD_TYPE=Release
          cmake --build cmake-build-release -j$(nproc)

      # The binary was just built in this container, against this container's Qt,
      # so reusing it is safe here — which is exactly what the flag asserts.
      - name: Build the .deb package
        run: |
          PROTONFORGE_REUSE_BINARY=1 bash build-deb.sh
          ls -lh protonforge_*.deb

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: protonforge-builds
          path: |
            cmake-build-release/ProtonForge
            protonforge_*.deb
          retention-days: 7

  # The distribution matrix (20_deb_install, 50_real_steam) is deliberately NOT
  # here. It builds ProtonForge from source once per target — four full release
  # builds plus an apt install of the Qt runtime each — which is minutes of CI for
  # a question that only changes when packaging or a distribution does, not on
  # every push. It is a local tool:
  #
  #     tests/steam-lab/steamlab test 20_deb_install
  #     LAB_DISTROS=debian:trixie tests/steam-lab/steamlab test 20_deb_install
  #
  # Run it before a release (RELEASE.md lists it) and after touching build-deb.sh,
  # debian/control or packaging/.

  # The fixture-driven tiers need no container of their own — they need a binary,
  # a virtual screen and nothing else.
  behaviour:
    name: behaviour and GUI
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04

    steps:
      - name: Prerequisites
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates python3 python3-dbus python3-gi dbus \
            xvfb openbox xdotool x11-utils x11-apps

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          grep -vE '^\s*(#|$)' packaging/build-depends.txt \
            | xargs env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends

      - name: Build
        run: |
          cmake -S . -B cmake-build-debug -DCMAKE_BUILD_TYPE=Debug -DPROTONFORGE_BUILD_TESTS=ON
          cmake --build cmake-build-debug -j$(nproc)

      # 80_proton_mgr is left out on purpose: it downloads a Proton build and
      # GitHub allows 60 unauthenticated API requests an hour per address, which
      # runners share. Run it locally with LAB_TEST_NETWORK=1.
      - name: Behaviour tests
        env:
          NO_COLOR: "1"
        run: |
          tests/steam-lab/steamlab test --keep-going \
            05_unit 30_discovery 40_launchopts 45_launch 55_steamclient 60_gui

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: steam-lab-behaviour
          path: |
            ~/.cache/protonforge-testlab/out/junit.xml
            ~/.cache/protonforge-testlab/out/**/*.log
            ~/.cache/protonforge-testlab/out/**/*.xwd
          retention-days: 7
          if-no-files-found: warn

  # The Flatpak, built from the working tree rather than from a release tarball.
  # No container: flatpak needs bubblewrap, and bubblewrap needs privileges a
  # normal container does not have (see tests/steam-lab/lib/flatpak.sh).
  flatpak:
    name: flatpak
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder python3-yaml
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Install build dependencies
        run: |
          grep -vE '^\s*(#|$)' packaging/build-depends.txt \
            | xargs sudo apt-get install -y --no-install-recommends

      - name: Build
        run: |
          cmake -S . -B cmake-build-debug -DCMAKE_BUILD_TYPE=Debug
          cmake --build cmake-build-debug -j$(nproc)

      - name: Flatpak tests
        env:
          NO_COLOR: "1"
        run: tests/steam-lab/steamlab test 70_flatpak

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: steam-lab-flatpak
          path: |
            ~/.cache/protonforge-testlab/out/junit.xml
            ~/.cache/protonforge-testlab/out/**/*.log
          retention-days: 7
          if-no-files-found: warn
