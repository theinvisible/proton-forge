name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v1.0.3

  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write  # Required for creating releases
  packages: write  # Optional, for package publishing

jobs:
  # Which distributions get a package. The list lives in packaging/distros.txt so
  # the test lab's matrix and this workflow cannot drift apart; the fourth column
  # is what marks a target as one we publish for.
  prepare:
    name: work out the targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read release targets
        id: targets
        run: |
          matrix="$(grep -vE '^\s*(#|$)' packaging/distros.txt \
            | awk -F'|' '$4=="yes" { printf "%s{\"image\":\"%s\"}", sep, $1; sep="," }')"
          [ -n "$matrix" ] || { echo "no release targets in packaging/distros.txt" >&2; exit 1; }
          echo "matrix=[$matrix]" >> "$GITHUB_OUTPUT"
          echo "Building for: [$matrix]"

      # Refuse rather than guess. Dispatched on a branch, the old stripping of
      # "refs/tags/v" left the version as "refs/heads/master" and produced a
      # release named after it. `gh workflow run release.yml --ref v1.2.3` is
      # the way to re-run one by hand.
      - name: Extract version from tag
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "This workflow releases a tag, but it was started on ${GITHUB_REF}." >&2
            echo "Re-run it with: gh workflow run release.yml --ref vX.Y.Z" >&2
            exit 1
          fi
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building version: ${VERSION}"

  # One package per distribution. A .deb only runs on the distribution it was
  # built against — the binary carries its Qt symbol versions — so each target
  # compiles in its own container and nothing is shared between them.
  build:
    name: ${{ matrix.image }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    container:
      image: ${{ matrix.image }}

    steps:
      - name: Install Git (required for checkout)
        run: |
          apt-get update
          apt-get install -y git

      - name: Checkout code
        uses: actions/checkout@v4

      # From packaging/build-depends.txt, like ci.yml. Naming the Qt packages
      # here instead would not survive the matrix: the runtime libraries were
      # renamed to libqt6core6t64 &c. in the 64-bit time_t transition, so a
      # hardcoded list is wrong on half the targets. qt6-base-dev pulls whatever
      # the distribution calls them.
      - name: Install build dependencies
        run: |
          apt-get update
          grep -vE '^\s*(#|$)' packaging/build-depends.txt \
            | xargs env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends

      # Read from the container rather than carried in packaging/distros.txt, so
      # it cannot be mistyped: 24.04 is noble, 26.04 is resolute.
      - name: Identify the distribution
        id: os
        run: |
          . /etc/os-release
          [ -n "$VERSION_CODENAME" ] || { echo "no VERSION_CODENAME in /etc/os-release" >&2; exit 1; }
          echo "codename=${VERSION_CODENAME}" >> "$GITHUB_OUTPUT"
          echo "Target: ${PRETTY_NAME} (${VERSION_CODENAME})"

      - name: Update CMakeLists.txt version
        run: |
          sed -i "s/project(ProtonForge VERSION [0-9.]\+/project(ProtonForge VERSION ${{ needs.prepare.outputs.version }}/" CMakeLists.txt
          grep "project(ProtonForge" CMakeLists.txt

      - name: Build release version
        run: |
          cmake -S . -B cmake-build-release -DCMAKE_BUILD_TYPE=Release
          cmake --build cmake-build-release -j$(nproc)

      # The binary was just built in this container against this container's Qt,
      # so reusing it is correct here. Without the flag build-deb.sh rebuilds from
      # scratch, because a binary from a different environment carries that
      # environment's Qt symbol versions and would produce a package that installs
      # and then refuses to start.
      #
      # The version suffix is what keeps the two packages apart, as files and once
      # installed. build-deb.sh prints the finished path as its last stdout line.
      - name: Build .deb package
        id: package
        run: |
          deb="$(PROTONFORGE_VERSION_SUFFIX="~${{ steps.os.outputs.codename }}" \
                 PROTONFORGE_REUSE_BINARY=1 bash build-deb.sh | tail -n1)"
          [ -f "$deb" ] || { echo "build-deb.sh did not report a package: $deb" >&2; exit 1; }
          echo "deb=${deb}" >> "$GITHUB_OUTPUT"

      - name: Verify .deb package
        run: |
          ls -lh "${{ steps.package.outputs.deb }}"
          dpkg-deb --info "${{ steps.package.outputs.deb }}"
          dpkg-deb --field "${{ steps.package.outputs.deb }}" Version

      # Named per target: upload-artifact v4 fails outright on a duplicate name.
      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: protonforge-deb-${{ steps.os.outputs.codename }}
          path: ${{ steps.package.outputs.deb }}
          retention-days: 30

  # One AppImage for everybody, built on the oldest distribution we support.
  #
  # Not part of the matrix above, and not because it would be inconvenient: an
  # AppImage runs on every glibc at least as new as the one it was built against,
  # so building it per target would produce four files of which three are strictly
  # worse. bookworm has the oldest glibc of the four, and one file covers the rest.
  #
  # Already inside a container, so build-appimage.sh is told not to start one of
  # its own — it is the same script a developer runs, and there it does the
  # containerising itself (see the note at the top of it).
  appimage:
    name: appimage (debian:bookworm)
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm

    steps:
      - name: Install Git (required for checkout)
        run: |
          apt-get update
          apt-get install -y git

      - name: Checkout code
        uses: actions/checkout@v4

      # Both lists, exactly as packaging/appimage/Dockerfile installs them: the
      # application's build dependencies and the extras only an AppImage needs.
      - name: Install build dependencies
        run: |
          apt-get update
          grep -hvE '^\s*(#|$)' packaging/build-depends.txt packaging/appimage/build-depends.txt \
            | xargs env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends

      # The same script the build image runs, so a release is built with the tools
      # that were tested rather than whatever is newest today.
      - name: Install linuxdeploy and the AppImage runtime
        run: bash packaging/appimage/install-tools.sh

      - name: Update CMakeLists.txt version
        run: |
          sed -i "s/project(ProtonForge VERSION [0-9.]\+/project(ProtonForge VERSION ${{ needs.prepare.outputs.version }}/" CMakeLists.txt
          grep "project(ProtonForge" CMakeLists.txt

      - name: Build the AppImage
        id: package
        env:
          PROTONFORGE_APPIMAGE_IN_CONTAINER: "1"
        run: |
          img="$(bash build-appimage.sh . dist | tail -n1)"
          [ -f "$img" ] || { echo "build-appimage.sh did not report an artifact: $img" >&2; exit 1; }
          echo "appimage=${img}" >> "$GITHUB_OUTPUT"

      # It has to start, and this is the only place it is tried before a user does
      # — the runner has Qt installed, so this proves less than the lab's bare
      # container does, but a bundle that cannot even run here is not shippable.
      - name: Verify the AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          ls -lh "${{ steps.package.outputs.appimage }}"
          "${{ steps.package.outputs.appimage }}" --version

      - name: Upload the AppImage
        uses: actions/upload-artifact@v4
        with:
          name: protonforge-appimage
          path: ${{ steps.package.outputs.appimage }}
          retention-days: 30

  # The release is created once, here, with every package attached. Doing it in
  # the matrix would have the legs race to create it and each re-send the body.
  publish:
    name: publish the release
    needs: [prepare, build, appimage]
    runs-on: ubuntu-latest
    steps:
      # Every artifact this run produced, not just the .debs — the pattern used to
      # name them and an AppImage would have been built and then quietly left in
      # the workflow run instead of the release.
      - name: Collect the packages
        uses: actions/download-artifact@v4
        with:
          pattern: protonforge-*
          merge-multiple: true
          path: packages

      - name: List what will be published
        run: ls -lh packages/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            packages/*.deb
            packages/*.AppImage
          generate_release_notes: true
          draft: false
          prerelease: false
          body: |
            ## ProtonForge v${{ needs.prepare.outputs.version }}

            ### Installation

            **Flatpak (Recommended - Universal Linux):**
            ```bash
            wget https://github.com/theinvisible/proton-forge/releases/download/v${{ needs.prepare.outputs.version }}/protonforge.flatpak
            flatpak install protonforge.flatpak
            flatpak run org.protonforge.ProtonForge
            ```

            **Debian/Ubuntu:**

            Pick the package built for your distribution — a `.deb` is linked
            against that distribution's Qt and will install but refuse to start
            on an older one.

            | Package | For |
            |---|---|
            | `protonforge_${{ needs.prepare.outputs.version }}~noble_amd64.deb` | Ubuntu 24.04 LTS and derivatives (Qt 6.4) |
            | `protonforge_${{ needs.prepare.outputs.version }}~resolute_amd64.deb` | Ubuntu 26.04 LTS and newer (Qt 6.10) |

            ```bash
            wget https://github.com/theinvisible/proton-forge/releases/download/v${{ needs.prepare.outputs.version }}/protonforge_${{ needs.prepare.outputs.version }}~noble_amd64.deb
            sudo apt-get install ./protonforge_${{ needs.prepare.outputs.version }}~noble_amd64.deb
            ```

            On any other distribution, use the Flatpak or build from source.

            **From Source:**
            ```bash
            git clone https://github.com/theinvisible/proton-forge.git
            cd proton-forge
            git checkout v${{ needs.prepare.outputs.version }}
            mkdir build && cd build
            cmake -DCMAKE_BUILD_TYPE=Release ..
            cmake --build . -j$(nproc)
            ```

            ### What's Changed
            See the full changelog below.

            ---

            **Qt Version:** 6.0+
            **GPU Focus:** NVIDIA (Proton management works on any GPU)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
