name: Build Flatpak

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'  # plain vX.Y.Z, as in release.yml

  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  flatpak:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The Flatpak builds from the tag's source archive, so the version it
      # reports is whatever CMakeLists.txt says at that tag — which is why the
      # two have to agree. On a branch there is no archive to fetch at all: the
      # old "dev" fallback went looking for vdev.tar.gz and failed there.
      - name: Extract version from tag
        id: get_version
        run: |
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "This workflow builds a tag, but it was started on ${GITHUB_REF}." >&2
            echo "Re-run it with: gh workflow run flatpak-release.yml --ref vX.Y.Z" >&2
            exit 1
          fi
          VERSION=${GITHUB_REF_NAME#v}
          CMAKE_VERSION="$(grep -oP 'project\(ProtonForge VERSION \K[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt || true)"
          if [ "${VERSION}" != "${CMAKE_VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match CMakeLists.txt (${CMAKE_VERSION:-no version found})." >&2
            exit 1
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building version: ${VERSION}"

      - name: Install Flatpak and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

      - name: Add Flathub repository
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Install KDE runtime and SDK
        run: |
          flatpak install --user -y flathub org.kde.Platform//6.8
          flatpak install --user -y flathub org.kde.Sdk//6.8

      - name: Update manifest with version
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION }}

          # Download and calculate SHA256 for the source archive
          wget "https://github.com/theinvisible/proton-forge/archive/v${VERSION}.tar.gz"
          SHA256=$(sha256sum "v${VERSION}.tar.gz" | awk '{print $1}')

          # Update SHA256 in manifest
          sed -i "s/sha256: REPLACE_WITH_ACTUAL_SHA256/sha256: ${SHA256}/" org.protonforge.ProtonForge.yml

          # Update version in manifest URL
          sed -i "s|url: https://github.com/theinvisible/proton-forge/archive/v[0-9.]\+\.tar\.gz|url: https://github.com/theinvisible/proton-forge/archive/v${VERSION}.tar.gz|" org.protonforge.ProtonForge.yml

          # Show the updated manifest
          echo "Updated manifest:"
          cat org.protonforge.ProtonForge.yml

      - name: Build Flatpak
        run: |
          flatpak-builder --user --disable-rofiles-fuse --repo=repo --force-clean flatpak_app org.protonforge.ProtonForge.yml
          flatpak build-bundle repo protonforge.flatpak org.protonforge.ProtonForge

      - name: Upload Flatpak bundle as artifact
        uses: actions/upload-artifact@v4
        with:
          name: protonforge-flatpak
          path: protonforge.flatpak
          retention-days: 30

      - name: Upload to release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v1
        with:
          files: protonforge.flatpak
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
