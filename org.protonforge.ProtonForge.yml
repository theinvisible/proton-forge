app-id: org.protonforge.ProtonForge
runtime: org.kde.Platform
runtime-version: '6.8'
sdk: org.kde.Sdk
command: protonforge

finish-args:
  # X11 + Wayland access
  - --socket=wayland
  - --socket=x11
  - --share=ipc

  # GPU acceleration
  - --device=dri

  # Network access (for downloading Proton versions)
  - --share=network

  # File system access
  - --filesystem=home
  # Game libraries on a second drive. NOT covered by --filesystem=home, and the
  # XDG file portal cannot stand in for it: that hands out a one-shot handle,
  # not a path a background download can keep writing to for an hour.
  - --filesystem=/run/media
  - --filesystem=/media
  - --filesystem=/mnt
  # Native Steam (~/.steam is a hidden dotdir; keep explicit so the symlink
  # target stays reachable on hosts that don't expose it via --filesystem=home)
  - --filesystem=~/.steam:rw
  - --filesystem=xdg-data/Steam:rw
  # Flatpak Steam — NOT covered by --filesystem=home because Flatpak protects
  # other apps' data dirs under ~/.var/app
  - --filesystem=~/.var/app/com.valvesoftware.Steam:rw

  # DBus access for desktop integration
  - --socket=session-bus

  # Allow running games
  - --talk-name=org.freedesktop.Flatpak

  # Credential storage. SecretStore falls back to a 0600 file when neither of
  # these answers, which is the normal state on a bare gaming session — so this
  # widens where credentials *can* live, it is not a requirement.
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.kwalletd6

  # Pulseaudio/Pipewire
  - --socket=pulseaudio

modules:
  # org.kde.Sdk ships libsecret-1.pc and the shared library but *not* the
  # headers, so qtkeychain's pkg-config check succeeds and the compile then
  # fails on <libsecret/secret.h>. Building it here puts headers and .pc under
  # /app, which comes first in PKG_CONFIG_PATH, so qtkeychain picks this one up.
  # Without libsecret, qtkeychain is left with KWallet over D-Bus only and every
  # non-KDE desktop silently falls through to SecretStore's 0600 file.
  - name: libsecret
    buildsystem: meson
    config-opts:
      # libdir is pinned, and this is the whole fix rather than a detail: meson
      # picks lib64 on its own, and flatpak-builder only overrides that from
      # 1.4.8 on. Built by an older one — GitHub's ubuntu-24.04 runner has
      # 1.4.2 — everything lands in /app/lib64, which is in neither
      # PKG_CONFIG_PATH nor the loader path. pkg-config then falls back to the
      # SDK's own libsecret-1.pc and qtkeychain fails on the missing header
      # exactly as it did with no module here at all.
      - --libdir=lib
      # crypto=disabled: the transport encryption wants libgcrypt or gnutls
      # headers, which the SDK is missing for the same reason. Secrets then
      # travel the session bus unencrypted — a bus only this user can talk to.
      - -Dcrypto=disabled
      - -Dmanpage=false
      - -Dgtk_doc=false
      - -Dvapi=false
      - -Dintrospection=false
      - -Dbash_completion=disabled
    cleanup:
      - /bin
      - /include
      - /lib/pkgconfig
      - /share/gtk-doc
    sources:
      - type: archive
        url: https://download.gnome.org/sources/libsecret/0.21/libsecret-0.21.7.tar.xz
        sha256: 6b452e4750590a2b5617adc40026f28d2f4903de15f1250e1d1c40bfd68ed55e

  # Not in org.kde.Platform, and small enough to build here. Without it the app
  # still works — SecretStore falls back to its own 0600 file — but credentials
  # would never reach the desktop's keyring.
  - name: qtkeychain
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      # Same reason as libsecret's --libdir, and the consequence here is worse
      # than a failed build: GNUInstallDirs picks lib64, flatpak-builder pins it
      # only from 1.4.8 on, and /app/lib64 is not on the loader path. Built by
      # the older one the bundle installs, exports and then dies on startup with
      # "libqt6keychain.so.1: cannot open shared object file".
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DBUILD_WITH_QT6=ON
      - -DBUILD_TEST_APPLICATION=OFF
    sources:
      # Matches the qtkeychain-qt6-dev the .deb build uses, so both packages get
      # the same backend behaviour. Note the tag carries no "v" prefix — the
      # older ones did, which is an easy 404 to write.
      - type: archive
        url: https://github.com/frankosterfeld/qtkeychain/archive/refs/tags/0.15.0.tar.gz
        sha256: f4254dc8f0933b06d90672d683eab08ef770acd8336e44dfa030ce041dc2ca22

  - name: protonforge
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: archive
        url: https://github.com/theinvisible/proton-forge/archive/v1.0.3.tar.gz
        sha256: REPLACE_WITH_ACTUAL_SHA256
      - type: file
        path: org.protonforge.ProtonForge.desktop
      - type: file
        path: org.protonforge.ProtonForge.metainfo.xml
      - type: file
        path: org.protonforge.ProtonForge.svg

    post-install:
      - install -Dm644 org.protonforge.ProtonForge.desktop /app/share/applications/org.protonforge.ProtonForge.desktop
      - install -Dm644 org.protonforge.ProtonForge.metainfo.xml /app/share/metainfo/org.protonforge.ProtonForge.metainfo.xml
      - install -Dm644 org.protonforge.ProtonForge.svg /app/share/icons/hicolor/scalable/apps/org.protonforge.ProtonForge.svg
      # Create symlink from protonforge to ProtonForge binary (Flatpak expects lowercase command)
      - ln -sf /app/bin/ProtonForge /app/bin/protonforge
